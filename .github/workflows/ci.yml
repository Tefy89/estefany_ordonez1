name: CI Workflow

on:
  push:
    branches: [ "ordonez" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install

      - name: Ejecutar tests
        run: npx jest
